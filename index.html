<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yash Delta - Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Yash Delta</h1>
    <p class="tag">Delta-style demo interface</p>

    <div class="warning">
      DEMO ONLY — this page does not execute Roblox scripts or modify games.
    </div>

    <label for="code">Script</label>
    <textarea id="code" placeholder="Paste text here..."></textarea>

    <div class="buttons">
      <button id="run">Run Demo</button>
      <button id="clear">Clear</button>
    </div>

    <div id="status">Ready.</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
